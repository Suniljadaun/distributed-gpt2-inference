# Runs the whole test suite (Chapters 3-18) on every push and pull request, then a short benchmark whose
# Matplotlib charts and summary are kept as a downloadable artifact.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu   # torch==2.14.1+cpu lives there
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Cache distilgpt2 weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-distilgpt2-v1

      - name: Download the model once (later steps run offline)
        env:
          HF_HUB_DISABLE_XET: "1"     # Xet's token endpoint 404s for the legacy "distilgpt2" alias; plain HTTP works
        run: python -c "from huggingface_hub import snapshot_download; snapshot_download('distilgpt2', allow_patterns=['*.json', '*.txt', 'model.safetensors'])"

      - name: Test suite
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m pytest -q -p no:cacheprovider

      - name: Short benchmark (correctness check, KV-cache, wire format)
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m src.bench.run_all --quick --only reference,kv_cache,wire

      - name: Keep the benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            results/summary.md
            results/bench/
            results/charts/
