// inference.proto - Ch 7 Tensor, Ch 8 StageWorker, Ch 9 KV-cache, Ch 10 Coordinator, Ch 11 ForwardBatch, Ch 12 Ping
// The messages of the distributed inference engine.
// Generate Python code (run from final\):
//   python -m grpc_tools.protoc -I . --python_out=. --pyi_out=. --grpc_python_out=. src/proto/inference.proto

syntax = "proto3";

package inference;

enum DType {
  DTYPE_UNSPECIFIED = 0;   // proto3 rule: the first enum value must be 0; we never use it
  FLOAT32 = 1;
  FLOAT16 = 2;
  BFLOAT16 = 3;
  INT64 = 4;
}

// A tensor on the wire: shape + element type + the raw bytes of its memory.
// data is little-endian, row-major (C-contiguous), exactly prod(shape) * element_size bytes.
message Tensor {
  repeated int64 shape = 1;
  DType dtype = 2;
  bytes data = 3;
}

// ---------------- Chapter 8: one pipeline stage = one worker process ----------------

service StageWorker {
  rpc Forward (ForwardRequest) returns (ForwardReply);   // run this worker's layers on one input
  rpc Info (InfoRequest) returns (InfoReply);            // which layers do you hold?
  rpc Release (ReleaseRequest) returns (ReleaseReply);   // Ch 9: forget a finished request's KV-cache
  rpc ForwardBatch (ForwardBatchRequest) returns (ForwardBatchReply);   // Ch 11: one decode step, many requests
  rpc Ping (PingRequest) returns (PingReply);            // Ch 12: heartbeat, cheap, answered without the model
}

// Ch 12: heartbeat
message PingRequest {}

message PingReply {
  string worker_id = 1;
  int64 generation = 2;      // which incarnation of this worker is answering
  int32 cached_requests = 3;
  double uptime_s = 4;
}

// Ch 11: a micro-batch. Every item is a single-token DECODE step of a different request.
message ForwardBatchRequest {
  repeated ForwardRequest items = 1;
}

message ForwardBatchReply {
  repeated ForwardReply items = 1;   // same order as the request's items
  double compute_ms = 2;             // the whole batch's layers, measured inside the worker
}

message ForwardRequest {
  string request_id = 1;
  int32 step_id = 2;       // 0 = prefill, then 1, 2, 3, ... one per generated token
  Tensor input = 3;        // first stage: token ids [1, s] int64; other stages: hidden [1, s, 768] float32
  int32 start_pos = 4;     // Ch 9: position of input's first token = tokens already in this request's cache
}

message ForwardReply {
  string request_id = 1;   // echoed back, so the caller can check the reply matches the request
  int32 step_id = 2;
  Tensor output = 3;       // hidden [1, s, 768] (not set by the last stage)
  int64 next_token = 4;    // only the last stage: greedy choice for the next token
  double compute_ms = 5;   // time spent in the layers, measured inside the worker
  int32 cache_len = 6;     // Ch 9: positions in this request's cache after this step
}

message InfoRequest {}

message InfoReply {
  string worker_id = 1;
  int32 first_layer = 2;   // holds blocks first_layer .. last_layer - 1
  int32 last_layer = 3;
  bool has_embed = 4;
  bool has_head = 5;
  int32 pid = 6;
  int64 param_bytes = 7;
  int32 cached_requests = 8;   // Ch 9: requests whose KV-cache this worker holds
  int64 kv_bytes = 9;          // Ch 9: total size of those caches
  int64 generation = 10;       // Ch 12: incarnation number, +1 on every restart
}

message ReleaseRequest {
  string request_id = 1;
}

message ReleaseReply {
  bool existed = 1;
  int64 freed_bytes = 2;
}

// ---------------- Chapter 10: the coordinator's front door ----------------

service Coordinator {
  rpc Generate (GenerateRequest) returns (GenerateReply);   // the caller's gRPC deadline = the request's deadline
  rpc Stats (StatsRequest) returns (StatsReply);            // counters, for monitoring and Little's Law
}

message GenerateRequest {
  string request_id = 1;
  repeated int64 prompt_ids = 2;
  int32 max_new_tokens = 3;
}

message GenerateReply {
  string request_id = 1;
  repeated int64 new_ids = 2;
  double queue_ms = 3;     // time waiting in the admission queue
  double service_ms = 4;   // time being generated
  int32 retries = 5;       // worker calls that had to be retried
}

message StatsRequest {}

message StatsReply {
  int32 queued = 1;        // waiting right now
  int32 running = 2;       // being generated right now
  int64 admitted = 3;      // totals since start ...
  int64 rejected = 4;      // queue was full
  int64 completed = 5;
  int64 expired = 6;       // deadline passed (in the queue or while running)
  int64 failed = 7;        // a worker error that retries could not fix
  int64 retries = 8;
  int64 lost = 9;          // Ch 12: in flight when a worker died; the client should retry
}
